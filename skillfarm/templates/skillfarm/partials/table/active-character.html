{% load i18n %}
{% load humanize %}
{% load static %}
<div class="table-responsive">
    <table class="table table-striped table-hover w-100" id="skillfarm-details">
        <thead>
            <tr>
                <th class="w-auto">{% translate "Character" %}</th>
                <th class="w-auto">{% translate "Progress" %}</th>
                <th class="w-auto">{% translate "Skill Info" %}</th>
                <th class="w-auto">{% translate "Last Updated" %}</th>
                <th class="w-auto">{% translate "Filter" %}</th>
                <th class="w-auto">{% translate "Actions" %}</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="6" class="text-center" id="loading-message-container">
                    <div class="spinner-border text-primary">
                        <span class="visually-hidden">{% translate "Loading..." %}</span>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
